[project]
name = "pokefit"
version = "0.1.0"
description = "Fit a figure inside a scaled Pokéball, add magnet pockets, verify printability"
requires-python = ">=3.11"
dependencies = [
    "numpy", "scipy", "trimesh", "manifold3d", "shapely", "pymeshfix", "pymeshlab",
    "embreex", "rtree", "lxml",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pokefit"]

[tool.setuptools.package-data]
pokefit = ["profiles/*.json"]

[project.optional-dependencies]
dev = ["pytest", "mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: real-file or Bambu Studio integration tests"]

[tool.mypy]
python_version = "3.11"
packages = ["pokefit"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
