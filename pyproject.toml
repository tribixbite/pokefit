[project]
name = "pokefit"
version = "0.1.0"
description = "Fit a figure inside a scaled Pokéball, add magnet pockets, verify printability"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
# The engine also runs in the browser (Pyodide): keep this list to packages Pyodide
# ships (manifold3d is swapped for its WebAssembly build there, see pokefit/geom.py).
dependencies = [
    "numpy", "scipy", "trimesh", "manifold3d", "shapely", "lxml", "contourpy", "pillow", "networkx",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pokefit"]

[tool.setuptools.package-data]
pokefit = ["profiles/*.json"]

[project.optional-dependencies]
dev = ["pytest", "mypy"]
# Local-only extras: self-intersection check (pymeshlab), mesh repair scripts (pymeshfix).
full = ["pymeshlab", "pymeshfix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: real-file or Bambu Studio integration tests"]

[tool.mypy]
python_version = "3.11"
packages = ["pokefit"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
