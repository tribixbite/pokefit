# Every push to main: run the gates, build the site, smoke-test the in-browser engine, deploy to
# GitHub Pages (https://pokefit.party). Pull requests run the same checks without deploying.
name: test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the engine
        run: pip install -e ".[dev]"
      - name: Type check (mypy)
        run: python -m mypy
      - name: Tests (pytest)
        run: python -m pytest -q

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"       # runs scripts/engine-smoke.ts (TypeScript) directly
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Type check and unit tests (web)
        working-directory: web
        run: bun run typecheck && bun test
      - name: Build the site
        working-directory: web
        run: bun run build

      - name: Cache Pyodide packages
        uses: actions/cache@v6
        with:
          path: web/.pyodide-cache
          key: pyodide-${{ hashFiles('web/bun.lock') }}
      - name: Smoke-test the browser engine (Pyodide under Node)
        working-directory: web
        run: node scripts/engine-smoke.ts

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
